services:
  - type: web
    name: lumi-ai
    runtime: node
    region: ohio
    plan: free
    branch: main
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /
    autoDeployTrigger: checksPass
    maxShutdownDelaySeconds: 60
    envVars:
      - key: NODE_VERSION
        value: 20.19.0
      - key: NEXT_PUBLIC_APP_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_URL
        sync: false
      - key: NEXT_PUBLIC_SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: REPLICATE_API_TOKEN
        sync: false
      - key: REPLICATE_IMAGE_MODEL
        sync: false
      - key: REPLICATE_VIDEO_MODEL
        sync: false
      - key: REPLICATE_IMAGE_INPUT_TEMPLATE
        value: '{"prompt":"{{prompt}}","aspect_ratio":"{{aspect_ratio}}"}'
      - key: REPLICATE_VIDEO_INPUT_TEMPLATE
        value: '{"prompt":"{{prompt}}","aspect_ratio":"{{aspect_ratio}}"}'
      - key: LUMI_IMAGE_CREDIT_COST
        value: "1"
      - key: LUMI_VIDEO_CREDIT_COST
        value: "10"
      - key: LUMI_MAX_UPLOAD_MB
        value: "20"
      - key: STRIPE_SECRET_KEY
        sync: false
      - key: STRIPE_WEBHOOK_SECRET
        sync: false
